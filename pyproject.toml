[project]
name = "lifx-async"
version = "7.3.0"
description = "A modern, type-safe, async Python library for controlling LIFX lights"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "UPL-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Avi Miller", email = "me@dje.li"}
]
maintainers = [
    {name = "Avi Miller", email = "me@dje.li"}
]
classifiers = [
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://djelibeybi.github.io/lifx-async/"
Documentation = "https://djelibeybi.github.io/lifx-async/"
Source = "https://github.com/Djelibeybi/lifx-async"
Changelog = "https://djelibeybi.github.io/lifx-async/changelog/"
Releasenotes = "https://github.com/Djelibeybi/lifx-async/releases"
Issues = "https://github.com/Djelibeybi/lifx-async/issues"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "lifx-emulator-core>=3.1.0",
    "llmstxt-standalone>=0.2.0",
    "mkdocstrings-python>=2.0.3",
    "prek>=0.3.6",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "pytest-retry>=1.7.0",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.2",
    "tomli>=2.0.1 ; python_full_version < '3.11'",
    "typing-extensions>=4.15.0",
    "zensical>=0.0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifx"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "PLC0415"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/lifx/{protocol,products}/generator.py" = ["E501"]
"src/lifx/protocol/packets.py" = ["E501"]
"src/lifx/products/registry.py" = ["E501"]
"benchmarks/*.py" = ["E501"]
"tests/benchmarks/*.py" = ["E501"]
# PLC0415 (import-outside-top-level) is enabled repository-wide, but these
# seven paths are not yet swept. Each entry is a visible, deletable line
# rather than a silent exclusion, so the owning phase removes its own line
# when it sweeps its files: Phase 18 deletes "tests/test_animation/**" and
# "tests/test_devices/test_multizone.py"; Phase 19 deletes
# "tests/test_theme/**". "src/**" and ".planning/**" remain for a future
# phase. ".agents/skills/**" and ".claude/skills/**" cover two archived
# spike harnesses preserved verbatim as evidence sources.
"src/**" = ["PLC0415"]
".planning/**" = ["PLC0415"]
"tests/test_animation/**" = ["PLC0415"]
"tests/test_theme/**" = ["PLC0415"]
"tests/test_devices/test_multizone.py" = ["PLC0415"]
".agents/skills/**" = ["PLC0415"]
".claude/skills/**" = ["PLC0415"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
# scripts/generate_theme_data.py is hand-written validation and path handling,
# so it stays type-checked even though it lives outside the package. The
# operator measurement scripts (.planning/scripts/measurement_support.py,
# .planning/scripts/thread_revalidation.py,
# .planning/scripts/measure_merged_discovery.py,
# .planning/scripts/ipv6_thread_probe.py) are likewise hand-written, not
# generated, so they stay type-checked too, even though .planning/ is a
# dot-directory pyright would otherwise skip by default -- the explicit
# exclude list below means that default dot-directory exclusion never
# applies here. The two maintainer CI tools in .github/
# (patch_coverage_guard.py and check_patch_coverage.py) are hand-written path
# handling and subprocess plumbing of exactly the same kind, so both are
# included too rather than checking one and silently skipping its sibling.
include = [
    "src",
    "scripts/generate_theme_data.py",
    ".planning/scripts/measurement_support.py",
    ".planning/scripts/thread_revalidation.py",
    ".planning/scripts/measure_merged_discovery.py",
    ".planning/scripts/ipv6_thread_probe.py",
    ".github/patch_coverage_guard.py",
    ".github/check_patch_coverage.py",
]
exclude = [
    "**/__pycache__",
    # The two mechanical emitters over remote YAML/JSON.
    "src/lifx/protocol/generator.py",
    "src/lifx/products/generator.py",
    "**/registry.py",   # Auto-generated from products.json
]
extraPaths = [".planning/scripts", ".github"]

[tool.bandit]
skips = ["B101", "B311"]

[tool.pytest.ini_options]
testpaths = ["tests", ".planning/scripts/tests"]
pythonpath = ["src", "scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """\
    -v
    -Wdefault
    --cov=lifx
    --cov=generate_theme_data
    --cov-branch
    --cov-report=xml
    --cov-report=term-missing:skip-covered
    --junitxml=junit.xml -o junit_family=legacy
    --cov-context=test
    """
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
retries = 1
retry_delay = 0
markers = [
    "emulator: tests that require the lifx-emulator-core embedded emulator",
    "targeted_ipv6_windows: focused targeted-IPv6 test enabled on Windows CI",
    "benchmark: performance benchmark tests, run with --benchmark to measure baselines",
    "tooling: relocated hardware and CI tooling tests under .planning/scripts/tests, run with --tooling",
]

[tool.coverage.run]
omit = [
    "src/lifx/protocol/generator.py",
    "src/lifx/protocol/protocol_types.py",
    "src/lifx/products/generator.py",
    # src/lifx/theme/data.py is generated; scripts/generate_theme_data.py that
    # emits it is hand-written and stays measured, so the emit-time backstops
    # keep their patch-coverage requirement.
    "src/lifx/theme/data.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
    # Bare `...` bodies: Protocol members and stubs, never executed
    '^\s*\.\.\.$',
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "(?!main$).*"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.changelog]
# Recommended patterns for conventional commits parser that is scope aware
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/changelog.md"
output_format = "md"

[tool.semantic_release.remote]
ignore_token_for_push = true
